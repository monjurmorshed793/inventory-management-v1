plugins {
    id 'java'
    id 'io.quarkus'
    id("io.mvnpm.gradle.plugin.native-java-plugin") version "1.0.0"
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    annotationProcessor enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-jdbc-h2'
    implementation 'io.quarkus:quarkus-hibernate-validator'
    implementation 'io.quarkiverse.renarde:quarkus-renarde:3.1.8'
    implementation "io.quarkiverse.web-bundler:quarkus-web-bundler:3.0.0"
    implementation "io.quarkiverse.web-bundler:quarkus-web-bundler-tailwindcss:3.0.0"
    implementation 'io.quarkus:quarkus-data-hibernate'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-hibernate-orm'
    annotationProcessor 'io.quarkus:quarkus-data-processor'
    testImplementation 'io.quarkus:quarkus-junit'
}

group = 'bd.gov.banbeis'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}
