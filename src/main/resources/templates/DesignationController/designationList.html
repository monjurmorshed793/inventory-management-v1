<div id="designation-list">
  <div class="flex flex-row justify-end items-end">
    <button class="btn btn-primary" command="show-modal" commandfor="modal" hx-get="/designation/edit?page={page}&size={size}" hx-target="#modal-content" hx-swap="outerHTML">Add New Designation</button>
  </div>
  <table  class="table">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Name (Bangla)</th>
        <th class="text-center">Grade</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {#for designation in designations}
        <tr>
          <td>{page.rowNumber(size, designation_count)}</td>
          <td>{designation.name}</td>
          <td>{designation.nameBn}</td>
          <td>{designation.grade}</td>
          <td class="flex flex-row justify-center items-center">
            <button class="btn btn-outline btn-sm" command="show-modal" commandfor="modal" hx-get="/designation/edit?page={page}&size={size}&id={designation.id}" hx-target="#modal-content" hx-swap="outerHTML">Edit</button>
          </td>
        </tr>
      {/for}
    </tbody>
  </table>
  <div id="pagination" hx-get="/page?url=/designation/list&page={page}&size={size}&totalItems={totalItems}" hx-trigger="load" hx-swap="outerHTML"></div>

  <dialog id="modal" closedby="any" class="modal" {#if initiate} hx-swap-oob="true" {/if}>
    <div class="modal-box">
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">X</button>
      </form>
      <div id="modal-content">
        <p>Loading...</p>
      </div>
      <div class="flex flex-row justify-center items-center gap-2 pt-3">
        <button id="submit-btn" hidden>Submit</button>
        <button class="btn btn-danger" command="close" commandfor="modal">Cancel</button>
      </div>
    </div>
    
  </dialog>
</div>
