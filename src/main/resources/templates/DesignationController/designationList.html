<div class="flex flex-row justify-end items-end">
  <button class="btn btn-primary">Add New Designation</button>
</div>
<table id="designation-list" class="table">
  <thead>
    <tr>
      <th>#</th>
      <th>Name</th>
      <th>Name (Bangla)</th>
      <th class="text-center">Grade</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {#for designation in designations}
      <tr>
        <td>{designation_count}</td>
        <td>{designation.name}</td>
        <td>{designation.nameBn}</td>
        <td>{designation.grade}</td>
        <td class="flex flex-row justify-center items-center">
          <button class="btn btn-outline btn-sm">Edit</button>
        </td>
      </tr>
    {/for}
  </tbody>
</table>
