{#include main-root}
    {#title}Login{/title}
    <div id="content" class="flex min-h-screen w-full items-center justify-center">
        <div  class="h-auto  md:w-2/4 card bg-base-100 shadow-sm">
            <div class="card-body">
                <h1 class="text-center text-3xl text-blue-700 pb-4">Login</h1>
                <form id="loginForm" class="grid grid-cols-1 gap-4 md:grid-cols-4">
                    <label class="label">Username</label>
                    <input name="username" type="text" class="input w-full md:col-span-3" placeholder="Username">

                    <label class="label">Password</label>
                    <input name="password" type="password" class="input w-full md:col-span-3">

                    <div class="w-full col-span-4 flex flex-col items-center justify-center">
                        <button class="btn btn-primary">Login</button>
                    </div>
                </form>
            </div>
        </div>    
    </div>

{/include}
