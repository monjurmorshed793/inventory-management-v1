<div id="modal-content" >
    <h1 class="font-2xl font-bold">Edit Department</h1>
    <form id="department-form">
        <input type="text" name="id" hidden value="{department.id}">
        <div class="flex flex-col">
            <label class="label">Name</label>
            <input name="name" class="input"  placeholder="Department name" value="{department.name}">
            {#ifError "name"}
                <span class="text-sm text-red-500">{#error "name"/}</span>
            {/ifError}
        </div>
        <div class="flex flex-col">
            <label class="label">Name (Bangla)</label>
            <input type="text" name="nameBn" class="input" placeholder="Department name (bangla)" value="{department.nameBn}">
            {#ifError "nameBn" }
                <span class="text-sm text-red-500">{#error "nameBn" /}</span>
            {/ifError}
        </div>
        <div class="flex flex-col">
            <label class="label">Office</label>
            <select class="select" name="office">
                <option disabled selected>Select office</option>
                {#for office in offices}
                    <option {#if department.office.id == office.id} selected {/if} value="{office.id}">{office.name}</option>
                {/for}
            </select>
            {#ifError "office"}
                <span class="text-sm text-red-500">{#error "office"/}</span>
            {/ifError}
        </div>
        <button id="submit-btn" class="btn btn-primary" type="submit" hx-swap-oob="true" hx-put="/department/update" hx-include="#department-form">Submit</button>
       
    </form>
</div>
