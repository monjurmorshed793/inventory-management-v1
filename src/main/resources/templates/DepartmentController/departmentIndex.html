{#if isHtmx}
    {#include $department_content /}
{#else}
    {#include dashboard-root}
        {#include $department_content /}

    {/include}
{/if}

{#fragment id=department_content rendered=false}
    {#if isHtmx}
        {#include dashboard-root$manu_list isHtmx=isHtmx route='department' /}
    {/if}
    <div class="card-body">
        <div class="card-title">Department</div>
        <select class="select" name='office' hx-get='/department/list' hx-include="[name='office']" hx-target='#department-list' hx-swap='outerHTML'>
            <option disabled selected>Select an office</option>
            {#for office in offices}
                <option value={office.id}>{office.name}</option>
            {/for}
        </select>
        <div id='department-list'></div>
    </div>
{/fragment}
