%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:file:./data/banbeis;AUTO_SERVER=TRUE
%dev.quarkus.datasource.username=banbeis
%dev.quarkus.datasource.password=
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%dev.quarkus.hibernate-orm.schema-management.create-schemas=true
%dev.quarkus.hibernate-orm.database.default-schema=inventory

# Must be set to get proper error reporting
quarkus.http.auth.proactive=false


# Log every HTTP request (method, URI, status, time)
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%{REMOTE_IP} "%r" %{RESPONSE_CODE} %Dms
# See why a REST request was rejected (validation/param errors)
quarkus.log.category."org.jboss.resteasy.reactive".level=DEBUG
quarkus.log.category."io.quarkus.vertx.http".level=DEBUG
quarkus.log.category."org.hibernate.validator".level=DEBUG
quarkus.log.category."io.quarkus.csrf.reactive".level=DEBUG
quarkus.log.category."io.quarkiverse.renarde".level=DEBUG


